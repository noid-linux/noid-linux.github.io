{{ define "main" }}
  <header class="mb-8">
    <h1 class="text-3xl font-semibold tracking-tight mb-2">{{ .Title }}</h1>
    {{ with .Content }}<div class="text-[#a89984]">{{ . }}</div>{{ end }}
  </header>
  {{ range .Pages }}
    <article class="py-5 border-b border-[#504945] first:border-t">
      <div class="flex items-start justify-between gap-4">
        <a href="{{ .RelPermalink }}" class="text-lg font-medium hover:text-[#d79921] transition-colors text-[#ebdbb2]">{{ .LinkTitle }}</a>
        <time class="text-[#a89984] text-xs font-mono whitespace-nowrap mt-1">{{ .Date | time.Format "2006-01-02" }}</time>
      </div>
    </article>
  {{ end }}
{{ end }}

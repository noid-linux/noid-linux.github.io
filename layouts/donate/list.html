{{ define "main" }}
<header class="mb-10">
	<h1 class="text-3xl font-semibold tracking-tight mb-2">Donate</h1>
	<p class="text-[#a89984] max-w-xl">
		Noid Linux is free and open source, developed in spare time. If you'd like
		to support the project, any amount helps.
	</p>
</header>

<div class="flex flex-col gap-2">
	<a
		href="https://ko-fi.com/noidlinux"
		target="_blank"
		rel="noopener"
		class="flex items-center gap-4 bg-[#282828] border border-[#504945] hover:border-[#d79921]/50 rounded-xl px-5 py-4 transition-colors group"
	>
		<img
			src="https://cdn.simpleicons.org/kofi/d79921"
			alt=""
			width="20"
			height="20"
			class="opacity-80 group-hover:opacity-100 transition-opacity shrink-0"
		/>
		<span class="font-medium text-[#ebdbb2]">Ko-fi</span>
		<span class="hidden sm:block text-[#a89984] text-sm font-mono ml-auto"
			>ko-fi.com/noidlinux →</span
		>
	</a>

	<a
		href="https://liberapay.com/noidlinux"
		target="_blank"
		rel="noopener"
		class="flex items-center gap-4 bg-[#282828] border border-[#504945] hover:border-[#d79921]/50 rounded-xl px-5 py-4 transition-colors group"
	>
		<img
			src="https://cdn.simpleicons.org/liberapay/d79921"
			alt=""
			width="20"
			height="20"
			class="opacity-80 group-hover:opacity-100 transition-opacity shrink-0"
		/>
		<span class="font-medium text-[#ebdbb2]">Liberapay</span>
		<span class="hidden sm:block text-[#a89984] text-sm font-mono ml-auto"
			>liberapay.com/noidlinux →</span
		>
	</a>

	<a
		href="https://opencollective.com/noidlinux"
		target="_blank"
		rel="noopener"
		class="flex items-center gap-4 bg-[#282828] border border-[#504945] hover:border-[#d79921]/50 rounded-xl px-5 py-4 transition-colors group"
	>
		<img
			src="https://cdn.simpleicons.org/opencollective/d79921"
			alt=""
			width="20"
			height="20"
			class="opacity-80 group-hover:opacity-100 transition-opacity shrink-0"
		/>
		<span class="font-medium text-[#ebdbb2]">Open Collective</span>
		<span class="hidden sm:block text-[#a89984] text-sm font-mono ml-auto"
			>opencollective.com/noidlinux →</span
		>
	</a>
</div>
{{ end }}
